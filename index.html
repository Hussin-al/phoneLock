<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone Lock</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Eigenes JS -->
  <script src="phoneLock.js" defer></script>
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title text-center mb-4">Handy-Sperre</h3>

            <div class="mb-3">
              <label for="lockTime" class="form-label">Wie lange soll das Handy gesperrt sein? (HH:mm)</label>
              <input type="text" class="form-control" id="lockTime" placeholder="z.B. 01:30">
            </div>

            <div class="d-grid mb-3">
              <button class="btn btn-primary btn-lg" id="lockButton">Sperren</button>
            </div>

            <div class="alert alert-info" id="currentTime" role="alert" style="display:none;"></div>
            <div class="alert alert-success" id="unlockTime" role="alert" style="display:none;"></div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
